<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffd9eb">
    <meta name="description" content="A playful Tesla-inspired emissions testing soundboard.">
    <meta name="color-scheme" content="light">
    <title>Toybox — Emissions Testing</title>
    <link rel="icon" href="./favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="mode-badge">
          <span class="mode-badge__light" aria-hidden="true"></span>
          Emissions testing mode
        </div>
        <p class="wordmark">TOYBOX</p>
        <figure class="model-y-hero">
          <img
            src="./images/pink-model-y-digital.webp"
            alt="A futuristic digital pink Tesla Model Y"
            width="800"
            height="453"
            decoding="async"
            fetchpriority="high"
          >
        </figure>
        <p class="intro">For when you want to play with the Tesla when I'm not around</p>
      </header>

      <section class="sound-grid" aria-label="Emissions soundboard">
        <button class="sound-button" type="button" data-sound="./audio/not_a_fart.wav" data-label="Not a Fart">
          <span class="sound-button__icon sound-button__icon--burst" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="sound-button__label">Not a</span>
          <span class="sound-button__detail">Fart</span>
        </button>

        <button class="sound-button" type="button" data-sound="./audio/short_shorts_ripper.wav" data-label="Short Shorts Ripper">
          <span class="sound-button__icon sound-button__icon--heavy" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="sound-button__label">Short Shorts</span>
          <span class="sound-button__detail">Ripper</span>
        </button>

        <button class="sound-button" type="button" data-sound="./audio/falcon_heavy.wav" data-label="Falcon Heavy">
          <span class="sound-button__icon sound-button__icon--plaid" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="sound-button__label">Falcon</span>
          <span class="sound-button__detail">Heavy</span>
        </button>

        <button class="sound-button" type="button" data-sound="./audio/ludicrous_fart.wav" data-label="Ludicrous Fart">
          <span class="sound-button__icon sound-button__icon--cyber" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="sound-button__label">Ludicrous</span>
          <span class="sound-button__detail">Fart</span>
        </button>

        <button class="sound-button" type="button" data-sound="./audio/neurastink.wav" data-label="Neurastink" aria-label="Neurastink">
          <span class="sound-button__icon sound-button__icon--charged" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="sound-button__label">Neura</span>
          <span class="sound-button__detail">stink</span>
        </button>

        <button class="sound-button" type="button" data-sound="./audio/boring_fart.wav" data-label="Boring Fart">
          <span class="sound-button__icon sound-button__icon--short" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="sound-button__label">Boring</span>
          <span class="sound-button__detail">Fart</span>
        </button>
      </section>

      <div class="playback-status" aria-live="polite" aria-atomic="true">
        <span class="playback-status__dot" aria-hidden="true"></span>
        <span data-status>Tap a sound to begin</span>
      </div>

      <footer>
        <span aria-hidden="true">P</span>
        Parked &bull; ready to play
      </footer>
    </main>

    <audio data-player preload="none"></audio>
  </body>
</html>
